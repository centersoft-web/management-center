<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imóveis & IPTU & Serviços</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: {
                            50: '#f0f9ff', 100: '#e0f2fe', 500: '#0284c7',
                            600: '#0369a1', 700: '#035485', 800: '#075985', 900: '#0c4a6e'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        @media print {
            .no-print { display: none !important; }
            body { background: white !important; color: black !important; zoom: 80%; }
            main { max-width: 100% !important; padding: 0 !important; margin: 0 !important; }
            header, nav { display: none !important; }
            th:nth-child(1), td:nth-child(1) { display: none !important; }
            .table-container { border: none !important; box-shadow: none !important; }
            th, td { border-bottom: 1px solid #ddd !important; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col justify-between">

    <header class="bg-gradient-to-r from-slate-900 via-brand-900 to-slate-900 text-white shadow-lg sticky top-0 z-50 no-print">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="p-2 bg-brand-500/20 rounded-xl border border-brand-500/30">
                    <i class="fa-solid fa-building text-2xl text-brand-500"></i>
                </div>
                <div>
                    <h1 class="text-xl sm:text-2xl font-bold tracking-tight">Imóveis & IPTU & Serviços</h1>
                    <p class="text-xs text-slate-300 font-medium">Gestão Integrada de Patrimônio e Contas</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="exportarDados()" class="inline-flex items-center justify-center gap-1.5 bg-slate-700 hover:bg-slate-600 text-white text-xs font-bold px-3 py-2 rounded-lg transition shadow-sm">
                    <i class="fa-solid fa-file-export"></i> Exportar
                </button>
                <button onclick="document.getElementById('importFile').click()" class="inline-flex items-center justify-center gap-1.5 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold px-3 py-2 rounded-lg transition shadow-sm">
                    <i class="fa-solid fa-file-import"></i> Importar
                </button>
                <input type="file" id="importFile" style="display:none" accept=".json" onchange="importarDados(event)">
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full flex-grow">
        <div class="space-y-6">
            <div class="bg-white rounded-2xl border border-slate-200/80 p-3 shadow-sm no-print">
                <div class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-8 gap-1.5" id="category-tabs">
                    <button onclick="switchTab('imoveis')" id="tab-imoveis" class="cat-btn py-2 px-1 text-center border border-slate-200 bg-slate-50 hover:bg-slate-100 font-bold rounded-lg text-xs text-slate-700 transition shadow-sm flex items-center justify-center gap-1.5 !border-brand-600 !text-brand-600 !bg-brand-50 shadow-inner">
                        <i class="fa-solid fa-house"></i> Imóveis
                    </button>
                    <button onclick="switchTab('matriculas')" id="tab-matriculas" class="cat-btn py-2 px-1 text-center border border-slate-200 bg-slate-50 hover:bg-slate-100 font-bold rounded-lg text-xs text-slate-700 transition shadow-sm flex items-center justify-center gap-1.5">
                        <i class="fa-solid fa-scroll"></i> Matrículas
                    </button>
                    <button onclick="switchTab('condominios')" id="tab-condominios" class="cat-btn py-2 px-1 text-center border border-slate-200 bg-slate-50 hover:bg-slate-100 font-bold rounded-lg text-xs text-slate-700 transition shadow-sm flex items-center justify-center gap-1.5">
                        <i class="fa-solid fa-city"></i> Condomínios
                    </button>
                    <button onclick="switchTab('luz')" id="tab-luz" class="cat-btn py-2 px-1 text-center border border-slate-200 bg-slate-50 hover:bg-slate-100 font-bold rounded-lg text-xs text-slate-700 transition shadow-sm flex items-center justify-center gap-1.5">
                        <i class="fa-solid fa-bolt"></i> Luz
                    </button>
                    <button onclick="switchTab('agua')" id="tab-agua" class="cat-btn py-2 px-1 text-center border border-slate-200 bg-slate-50 hover:bg-slate-100 font-bold rounded-lg text-xs text-slate-700 transition shadow-sm flex items-center justify-center gap-1.5">
                        <i class="fa-solid fa-droplet"></i> Água
                    </button>
                    <button onclick="switchTab('telefone')" id="tab-telefone" class="cat-btn py-2 px-1 text-center border border-slate-200 bg-slate-50 hover:bg-slate-100 font-bold rounded-lg text-xs text-slate-700 transition shadow-sm flex items-center justify-center gap-1.5">
                        <i class="fa-solid fa-phone"></i> Telefone
                    </button>
                    <button onclick="switchTab('gas')" id="tab-gas" class="cat-btn py-2 px-1 text-center border border-slate-200 bg-slate-50 hover:bg-slate-100 font-bold rounded-lg text-xs text-slate-700 transition shadow-sm flex items-center justify-center gap-1.5">
                        <i class="fa-solid fa-fire"></i> Gás
                    </button>
                    <button onclick="switchTab('saude')" id="tab-saude" class="cat-btn py-2 px-1 text-center border border-slate-200 bg-slate-50 hover:bg-slate-100 font-bold rounded-lg text-xs text-slate-700 transition shadow-sm flex items-center justify-center gap-1.5">
                        <i class="fa-solid fa-notes-medical"></i> Saúde
                    </button>
                </div>
            </div>

            <div id="main-content"></div>
        </div>
    </main>

    <footer class="bg-white border-t border-slate-200 mt-12 py-6 text-center text-xs text-slate-500 no-print">
        <div class="max-w-7xl mx-auto px-4">
            <p>Sistema Integrado de Gestão Patrimonial e Utilitários.</p>
            <p class="mt-1 text-slate-400">&copy; Gestão Patrimonial - Todos os direitos reservados.</p>
        </div>
    </footer>

    <script>
        const STORAGE_KEY = 'asset_pro_master_data';

        const categoryConfig = {
            imoveis:    { label: "Imóveis & IPTU",            icon: "fa-house",         fields: ["Nome", "Cidade", "Inscrição", "Cadastro IPTU", "Consulta IPTU"] },
            matriculas: { label: "Matrículas (Reg. Imóveis)", icon: "fa-scroll",        fields: ["Nome", "Cidade", "Matrícula", "Link"] },
            condominios:{ label: "Condomínios",               icon: "fa-city",          fields: ["Condomínio", "Cidade", "Ref/Inscrição", "Link"] },
            luz:        { label: "Luz",                       icon: "fa-bolt",          fields: ["Identificação", "Cidade", "Instalação", "Link"] },
            agua:       { label: "Água",                      icon: "fa-droplet",       fields: ["Identificação", "Cidade", "RGI", "Link"] },
            telefone:   { label: "Telefone",                  icon: "fa-phone",         fields: ["Linha/ID", "Operadora", "Número", "Link"] },
            gas:        { label: "Gás",                       icon: "fa-fire",          fields: ["Identificação", "Cidade", "Código", "Link"] },
            saude:      { label: "Assistência Médica",        icon: "fa-notes-medical", fields: ["Plano", "Operadora", "Matrícula", "Link"] }
        };

        // Imóveis e Matrículas são pares: cada item de uma lista tem um par na outra com o mesmo id.
        const PARES = ['imoveis', 'matriculas'];
        const isPar = t => PARES.includes(t);
        const outroTipo = t => (t === 'imoveis' ? 'matriculas' : 'imoveis');

        const INPUT_FORM = "px-3 py-1.5 bg-white border border-slate-300 rounded-lg text-slate-900 text-xs font-semibold focus:ring-2 focus:ring-brand-500 outline-none transition";
        const INPUT_EDIT = "w-full px-2 py-1 bg-white border border-slate-300 rounded text-xs";

        // ---------- Utilitários ----------
        let _seq = 0;
        function novoId() {
            _seq = (_seq + 1) % 1000;
            return Date.now() * 1000 + _seq;
        }

        function esc(v) {
            return String(v ?? '')
                .replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;')
                .replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        function val(id) {
            const el = document.getElementById(id);
            return el ? el.value : '';
        }

        // Garante que cada categoria exista e que cada item tenha id único dentro da sua lista.
        function normalizarDados(d) {
            const out = {};
            Object.keys(categoryConfig).forEach(cat => {
                out[cat] = Array.isArray(d && d[cat]) ? d[cat] : [];
                const vistos = new Set();
                out[cat].forEach(item => {
                    if (item.id == null || vistos.has(item.id)) item.id = novoId();
                    vistos.add(item.id);
                });
            });
            return out;
        }

        function carregarDados() {
            try {
                return normalizarDados(JSON.parse(localStorage.getItem(STORAGE_KEY)));
            } catch (e) {
                return normalizarDados({});
            }
        }

        let data = carregarDados();
        let editIdx = { type: null, index: null };

        // ---------- Layout ----------
        function initLayout() {
            const main = document.getElementById('main-content');
            main.innerHTML = '';
            Object.keys(categoryConfig).forEach(cat => {
                const cfg = categoryConfig[cat];
                const section = document.createElement('div');
                section.id = `section-${cat}`;
                section.className = `view-section ${cat === 'imoveis' ? 'block' : 'hidden'}`;

                const inputs = cfg.fields.map((placeholder, i) => {
                    const extra = (cat === 'telefone' && i === 2) ? 'oninput="maskTel(this)" maxlength="15"' : '';
                    return `<input type="text" id="${cat}F${i + 1}" placeholder="${placeholder}" ${extra} class="${INPUT_FORM}">`;
                }).join('');

                const headers = cfg.fields.map(f => `<th class="py-3 px-3 text-left">${f}</th>`).join('');

                section.innerHTML = `
                    <div class="bg-white rounded-2xl border border-slate-200/80 p-5 shadow-sm space-y-4">
                        <div class="flex items-center gap-2 border-b border-slate-100 pb-3">
                            <i class="fa-solid ${cfg.icon} text-brand-600 text-lg"></i>
                            <h2 class="text-base font-bold text-slate-900">${cfg.label}</h2>
                        </div>

                        <div class="no-print bg-slate-50 p-3.5 rounded-xl border border-slate-200/80 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-6 gap-2.5">
                            ${inputs}
                            <button class="bg-brand-600 hover:bg-brand-500 text-white text-xs font-bold px-3 py-1.5 rounded-lg transition shadow-sm flex items-center justify-center gap-1.5" onclick="addItem('${cat}')">
                                <i class="fa-solid fa-plus-circle"></i> Adicionar
                            </button>
                        </div>

                        <div class="table-container overflow-x-auto rounded-xl border border-slate-200">
                            <table class="w-full text-left text-xs border-collapse">
                                <thead>
                                    <tr class="bg-slate-900 text-white font-bold uppercase tracking-wider text-[11px]">
                                        <th class="py-3 px-3 text-center w-[60px]">Ordem</th>
                                        ${headers}
                                        <th class="no-print py-3 px-3 text-center w-[180px]">Ações</th>
                                    </tr>
                                </thead>
                                <tbody id="body-${cat}" class="divide-y divide-slate-100 bg-white font-medium text-slate-700"></tbody>
                            </table>
                        </div>
                    </div>`;
                main.appendChild(section);
            });
            render();
        }

        function maskTel(i) {
            let v = i.value.replace(/\D/g, "");
            v = v.replace(/^(\d{2})(\d)/g, "($1) $2");
            v = v.replace(/(\d)(\d{4})$/, "$1-$2");
            i.value = v;
        }

        function switchTab(tab) {
            document.querySelectorAll('.view-section').forEach(s => {
                s.classList.remove('block');
                s.classList.add('hidden');
            });
            document.querySelectorAll('.cat-btn').forEach(n => {
                n.classList.remove('!border-brand-600', '!text-brand-600', '!bg-brand-50', 'shadow-inner');
            });
            const target = document.getElementById('section-' + tab);
            if (target) { target.classList.remove('hidden'); target.classList.add('block'); }
            const targetTab = document.getElementById('tab-' + tab);
            if (targetTab) targetTab.classList.add('!border-brand-600', '!text-brand-600', '!bg-brand-50', 'shadow-inner');
        }

        // ---------- Renderização ----------
        function render() {
            Object.keys(categoryConfig).forEach(renderTable);
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            } catch (e) {
                console.error('Falha ao salvar no localStorage', e);
            }
        }

        function renderTable(type) {
            const body = document.getElementById(`body-${type}`);
            if (!body) return;
            body.innerHTML = data[type].map((item, index) => {
                const emEdicao = editIdx.type === type && editIdx.index === index;
                return emEdicao ? linhaEdicao(type, item, index) : linhaNormal(type, item, index);
            }).join('');
        }

        function portal(url) {
            return url
                ? `<a href="${esc(url)}" target="_blank" rel="noopener" class="inline-flex items-center gap-1 text-brand-600 hover:text-brand-800 font-semibold text-xs hover:underline"><i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i> Portal</a>`
                : '<span class="text-slate-400">-</span>';
        }

        function linhaNormal(type, item, index) {
            const linkPrincipal = type === 'imoveis' ? item.cadastroIptu : item.link;
            const colunaExtra = type === 'imoveis'
                ? `<td class="p-2.5">${portal(item.link)}</td>`
                : '';
            const sync = isPar(type)
                ? '<i class="fa-solid fa-rotate text-brand-500 text-[10px]" title="Sincronizado"></i>'
                : '';
            const copiar = item.insc
                ? `<button class="bg-white hover:bg-slate-100 border border-slate-300 text-slate-600 text-[10px] px-1.5 py-0.5 rounded transition shadow-sm" data-copiar="${esc(item.insc)}" onclick="copiarDe(this)"><i class="fa-regular fa-copy"></i> Copiar</button>`
                : '';

            return `
                <tr class="hover:bg-slate-50 transition border-b border-slate-100">
                    <td class="no-print p-2 text-center align-middle">
                        <div class="flex flex-col gap-1 items-center justify-center">
                            <button class="w-7 h-5 bg-slate-100 hover:bg-brand-600 hover:text-white border border-slate-300 rounded text-slate-600 flex items-center justify-center text-xs transition" onclick="mover('${type}', ${index}, -1)"><i class="fa-solid fa-chevron-up text-[10px]"></i></button>
                            <button class="w-7 h-5 bg-slate-100 hover:bg-brand-600 hover:text-white border border-slate-300 rounded text-slate-600 flex items-center justify-center text-xs transition" onclick="mover('${type}', ${index}, 1)"><i class="fa-solid fa-chevron-down text-[10px]"></i></button>
                        </div>
                    </td>
                    <td class="p-2.5">
                        <div class="flex items-center gap-1.5">
                            ${sync}
                            <span class="font-bold text-slate-900">${esc(item.nome)}</span>
                        </div>
                    </td>
                    <td class="p-2.5">${esc(item.cidade)}</td>
                    <td class="p-2.5">
                        <div class="flex items-center gap-2">
                            <code class="bg-slate-100 px-1.5 py-0.5 rounded text-[11px] font-mono border border-slate-200 text-slate-800">${esc(item.insc)}</code>
                            ${copiar}
                        </div>
                    </td>
                    <td class="p-2.5">${portal(linkPrincipal)}</td>
                    ${colunaExtra}
                    <td class="no-print p-2.5 text-center">
                        <div class="flex items-center justify-center gap-1">
                            <button class="text-emerald-600 hover:bg-emerald-50 p-1.5 rounded text-sm transition" title="Inserir abaixo" onclick="insertRow('${type}', ${index})"><i class="fa-solid fa-circle-plus"></i></button>
                            <button class="text-violet-600 hover:bg-violet-50 p-1.5 rounded text-sm transition" title="Duplicar item abaixo" onclick="duplicateRow('${type}', ${index})"><i class="fa-solid fa-copy"></i></button>
                            <button class="text-brand-600 hover:bg-brand-50 p-1.5 rounded text-sm transition" title="Editar" onclick="setEdit('${type}', ${index})"><i class="fa-solid fa-pen-to-square"></i></button>
                            <button class="text-rose-600 hover:bg-rose-50 p-1.5 rounded text-sm transition" title="Excluir" onclick="removeItem('${type}', ${index})"><i class="fa-solid fa-trash-can"></i></button>
                        </div>
                    </td>
                </tr>`;
        }

        function linhaEdicao(type, item, index) {
            const campo4 = type === 'imoveis' ? item.cadastroIptu : item.link;
            const extra = type === 'imoveis'
                ? `<td class="p-2"><input type="text" id="edit-f5" value="${esc(item.link)}" class="${INPUT_EDIT}"></td>`
                : '';
            const mascara = type === 'telefone' ? 'oninput="maskTel(this)" maxlength="15"' : '';

            return `
                <tr class="bg-amber-50/50">
                    <td></td>
                    <td class="p-2"><input type="text" id="edit-f1" value="${esc(item.nome)}" class="${INPUT_EDIT}"></td>
                    <td class="p-2"><input type="text" id="edit-f2" value="${esc(item.cidade)}" class="${INPUT_EDIT}"></td>
                    <td class="p-2"><input type="text" id="edit-f3" value="${esc(item.insc)}" ${mascara} class="${INPUT_EDIT}"></td>
                    <td class="p-2"><input type="text" id="edit-f4" value="${esc(campo4)}" class="${INPUT_EDIT}"></td>
                    ${extra}
                    <td class="no-print p-2 text-center">
                        <div class="flex items-center justify-center gap-1">
                            <button class="bg-emerald-600 hover:bg-emerald-500 text-white text-[11px] font-bold px-2 py-1 rounded transition" onclick="saveEdit('${type}', ${index})">Salvar</button>
                            <button class="bg-slate-400 hover:bg-slate-500 text-white text-[11px] font-bold px-2 py-1 rounded transition" onclick="cancelEdit()">Cancelar</button>
                        </div>
                    </td>
                </tr>`;
        }

        // ---------- Ações ----------
        function setEdit(type, index) { editIdx = { type, index }; render(); }
        function cancelEdit() { editIdx = { type: null, index: null }; render(); }

        function saveEdit(type, index) {
            const item = data[type][index];
            if (!item) return;

            item.nome = val('edit-f1');
            item.cidade = val('edit-f2');
            item.insc = val('edit-f3');
            if (type === 'imoveis') {
                item.cadastroIptu = val('edit-f4');
                item.link = val('edit-f5');
            } else {
                item.link = val('edit-f4');
            }

            // Mantém nome e cidade iguais no par (Imóveis <-> Matrículas)
            if (isPar(type)) {
                const par = data[outroTipo(type)].find(i => i.id === item.id);
                if (par) { par.nome = item.nome; par.cidade = item.cidade; }
            }
            cancelEdit();
        }

        function addItem(type) {
            const nome = val(type + 'F1').trim();
            if (!nome) return;

            const novo = {
                id: novoId(),
                nome,
                cidade: val(type + 'F2'),
                insc: val(type + 'F3'),
                cadastroIptu: '',
                link: ''
            };
            if (type === 'imoveis') {
                novo.cadastroIptu = val('imoveisF4');
                novo.link = val('imoveisF5');
            } else {
                novo.link = val(type + 'F4');
            }

            data[type].push(novo);
            if (isPar(type)) {
                data[outroTipo(type)].push({ ...novo, insc: '', link: '' });
            }

            for (let n = 1; n <= 5; n++) {
                const el = document.getElementById(type + 'F' + n);
                if (el) el.value = '';
            }
            render();
        }

        function insertRow(type, index) {
            const src = data[type][index];
            if (!src) return;
            const id = novoId();

            data[type].splice(index + 1, 0, { id, nome: '', cidade: '', insc: '', cadastroIptu: '', link: '' });

            if (isPar(type)) {
                const outro = data[outroTipo(type)];
                const pos = outro.findIndex(i => i.id === src.id);
                outro.splice(pos === -1 ? outro.length : pos + 1, 0,
                    { id, nome: '', cidade: '', insc: '', cadastroIptu: '', link: '' });
            }
            setEdit(type, index + 1);
        }

        function duplicateRow(type, index) {
            const src = data[type][index];
            if (!src) return;
            const id = novoId();

            data[type].splice(index + 1, 0, { ...src, id });

            if (isPar(type)) {
                const outro = data[outroTipo(type)];
                const pos = outro.findIndex(i => i.id === src.id);
                const copia = pos === -1
                    ? { id, nome: src.nome, cidade: src.cidade, insc: '', cadastroIptu: '', link: '' }
                    : { ...outro[pos], id };
                outro.splice(pos === -1 ? outro.length : pos + 1, 0, copia);
            }
            render();
        }

        // Exclui somente o item clicado (e, em pares, somente o seu par — pelo id).
        function removeItem(type, index) {
            if (!confirm("Excluir este item?")) return;
            const item = data[type][index];
            if (!item) return;

            data[type].splice(index, 1);

            if (isPar(type)) {
                const outro = data[outroTipo(type)];
                const pos = outro.findIndex(i => i.id === item.id);
                if (pos !== -1) outro.splice(pos, 1);
            }

            editIdx = { type: null, index: null };
            render();
        }

        // Move o item para cima/baixo; em pares, espelha a troca no outro lado pelo id.
        function mover(type, index, direcao) {
            const lista = data[type];
            const novo = index + direcao;
            if (novo < 0 || novo >= lista.length) return;

            [lista[index], lista[novo]] = [lista[novo], lista[index]];

            if (isPar(type)) {
                const outro = data[outroTipo(type)];
                const a = outro.findIndex(i => i.id === lista[index].id);
                const b = outro.findIndex(i => i.id === lista[novo].id);
                if (a !== -1 && b !== -1) [outro[a], outro[b]] = [outro[b], outro[a]];
            }
            editIdx = { type: null, index: null };
            render();
        }

        function copiarDe(btn) {
            const texto = btn.dataset.copiar;
            if (!texto || texto === '-') return;
            navigator.clipboard.writeText(texto).catch(() => {});
            const old = btn.innerHTML;
            btn.innerHTML = "<i class='fa-solid fa-check text-emerald-600'></i> OK!";
            setTimeout(() => { btn.innerHTML = old; }, 1000);
        }

        // ---------- Exportar / Importar ----------
        function exportarDados() {
            const agora = new Date();
            const p = n => String(n).padStart(2, '0');
            const nomeArquivo = `Imoveis_IPTU_${agora.getFullYear()}-${p(agora.getMonth() + 1)}-${p(agora.getDate())}_${p(agora.getHours())}h${p(agora.getMinutes())}.json`;
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = nomeArquivo;
            a.click();
            URL.revokeObjectURL(url);
        }

        function importarDados(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = ev => {
                try {
                    data = normalizarDados(JSON.parse(ev.target.result));
                    editIdx = { type: null, index: null };
                    render();
                } catch (err) {
                    alert("Erro ao importar o arquivo.");
                }
                e.target.value = '';
            };
            reader.readAsText(file);
        }

        window.onload = initLayout;
    </script>
</body>
</html>
